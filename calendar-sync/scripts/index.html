<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
// ── Service Account JWT Auth ─────────────────────────────────────────────────
// Generates a short-lived access token from a Google service account JSON.
// Uses Web Crypto API (RS256) — no server needed, no token expiry to manage.

async function getAccessToken(serviceAccountJson) {
  const sa = typeof serviceAccountJson === 'string'
    ? JSON.parse(serviceAccountJson)
    : serviceAccountJson;

  const now = Math.floor(Date.now() / 1000);
  const header = { alg: 'RS256', typ: 'JWT' };
  const payload = {
    iss: sa.client_email,
    scope: 'https://www.googleapis.com/auth/calendar',
    aud: 'https://oauth2.googleapis.com/token',
    iat: now,
    exp: now + 3600
  };

  const b64url = (obj) => btoa(JSON.stringify(obj))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');

  const signingInput = `${b64url(header)}.${b64url(payload)}`;

  // Import RSA private key from PEM
  const pemBody = sa.private_key
    .replace(/-----BEGIN PRIVATE KEY-----/, '')
    .replace(/-----END PRIVATE KEY-----/, '')
    .replace(/\n/g, '');
  const keyDer = Uint8Array.from(atob(pemBody), c => c.charCodeAt(0));

  const cryptoKey = await crypto.subtle.importKey(
    'pkcs8', keyDer.buffer,
    { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' },
    false, ['sign']
  );

  const sig = await crypto.subtle.sign(
    'RSASSA-PKCS1-v1_5',
    cryptoKey,
    new TextEncoder().encode(signingInput)
  );

  const sigB64 = btoa(String.fromCharCode(...new Uint8Array(sig)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');

  const jwt = `${signingInput}.${sigB64}`;

  // Exchange JWT for access token
  const tokenRes = await fetch('https://oauth2.googleapis.com/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`
  });

  if (!tokenRes.ok) {
    const err = await tokenRes.text();
    throw new Error(`Token exchange failed: ${err}`);
  }

  const tokenData = await tokenRes.json();
  return tokenData.access_token;
}

// ── Main skill function ──────────────────────────────────────────────────────
window['ai_edge_gallery_get_result'] = async (data) => {
  try {
    const input = JSON.parse(data);
    const { action, secret } = input;

    if (!secret) {
      return JSON.stringify({ error: 'No service account JSON. Add it via skill settings.' });
    }

    let serviceAccount;
    try {
      serviceAccount = JSON.parse(secret);
    } catch {
      return JSON.stringify({ error: 'Secret is not valid JSON. Paste the full service account JSON.' });
    }

    if (!serviceAccount.client_email || !serviceAccount.private_key) {
      return JSON.stringify({ error: 'Service account JSON missing client_email or private_key.' });
    }

    // Get fresh access token (generated each call — no expiry tracking needed)
    const accessToken = await getAccessToken(serviceAccount);
    const calendarId = encodeURIComponent(input.calendarId || 'primary');
    const BASE = `https://www.googleapis.com/calendar/v3/calendars/${calendarId}/events`;
    const headers = {
      'Authorization': `Bearer ${accessToken}`,
      'Content-Type': 'application/json'
    };

    // ── PUSH ──────────────────────────────────────────────────────────────
    if (action === 'push') {
      const evt = input.event;
      if (!evt || !evt.name || !evt.date || !evt.startTime) {
        return JSON.stringify({ error: 'Missing event fields: name, date, startTime' });
      }

      const startDateTime = `${evt.date}T${evt.startTime}:00`;
      let endDateTime;
      if (evt.endTime) {
        endDateTime = `${evt.date}T${evt.endTime}:00`;
      } else {
        const d = new Date(startDateTime);
        d.setHours(d.getHours() + 1);
        endDateTime = d.toISOString().slice(0, 19);
      }

      const body = {
        summary: evt.name,
        location: evt.location || undefined,
        description: [
          evt.description,
          `[Synced from device · ${new Date().toLocaleString('fi-FI', { timeZone: 'Europe/Helsinki' })}]`
        ].filter(Boolean).join('\n\n'),
        start: { dateTime: startDateTime, timeZone: 'Europe/Helsinki' },
        end:   { dateTime: endDateTime,   timeZone: 'Europe/Helsinki' }
      };

      // Update if already has a Google event ID, otherwise insert
      const isUpdate = Boolean(evt.googleEventId);
      const url = isUpdate ? `${BASE}/${evt.googleEventId}` : BASE;
      const method = isUpdate ? 'PUT' : 'POST';

      const response = await fetch(url, { method, headers, body: JSON.stringify(body) });

      if (response.status === 401) return JSON.stringify({ error: 'Auth failed (401). Re-paste service account JSON in skill settings.' });
      if (response.status === 403) return JSON.stringify({ error: 'Permission denied (403). Share calendar with ' + serviceAccount.client_email });
      if (response.status === 409) return JSON.stringify({ result: 'Already exists', googleEventId: evt.googleEventId });
      if (!response.ok) {
        const errBody = await response.text();
        return JSON.stringify({ error: `Google API ${response.status}: ${errBody}` });
      }

      const created = await response.json();
      return JSON.stringify({ result: `Pushed: ${created.id}`, googleEventId: created.id, htmlLink: created.htmlLink });
    }

    // ── LIST (fetch from Google Calendar) ────────────────────────────────
    if (action === 'list') {
      const params = new URLSearchParams({
        timeMin: input.from ? `${input.from}T00:00:00Z` : new Date().toISOString(),
        maxResults: String(input.limit || 20),
        singleEvents: 'true',
        orderBy: 'startTime'
      });
      if (input.to) params.set('timeMax', `${input.to}T23:59:59Z`);

      const response = await fetch(`${BASE}?${params}`, { headers });
      if (!response.ok) return JSON.stringify({ error: `Google API ${response.status}` });

      const json = await response.json();
      const events = (json.items || []).map(e => ({
        googleEventId: e.id,
        name: e.summary,
        start: e.start.dateTime || e.start.date,
        end: e.end.dateTime || e.end.date,
        location: e.location,
        htmlLink: e.htmlLink
      }));
      return JSON.stringify({ result: JSON.stringify(events) });
    }

    return JSON.stringify({ error: `Unknown action: ${action}` });

  } catch (err) {
    return JSON.stringify({ error: err.message });
  }
};
</script>
</body>
</html>
